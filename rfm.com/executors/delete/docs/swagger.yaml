basePath: /
definitions:
  model.CreateException:
    properties:
      details:
        type: string
      exception:
        type: string
    type: object
  model.CreateRequest:
    properties:
      content:
        type: string
      name:
        type: string
      path:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is one of the executors that works in the Remote-File-Manager
    application.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Remote-File-Manager - Create Executor

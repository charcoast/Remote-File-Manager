paths:
  /create/directory:
    post:
      consumes:
      - application/json
      description: Create a file int a given path
      operationId: create-directory
      parameters:
      - description: The information about the file to be created
        in: body
        name: CreateRequest
        required: true
        schema:
          $ref: '#/definitions/model.CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            type: string
        "400":
          description: Can not create the directory
          schema:
            $ref: '#/definitions/model.CreateException'
        "404":
          description: Can not create the directory
          schema:
            $ref: '#/definitions/model.CreateException'
      summary: Create a file
  /create/file:
    post:
      consumes:
      - application/json
      description: Create a file int a given path
      operationId: create-file
      parameters:
      - description: The information about the file to be created
        in: body
        name: CreateRequest
        required: true
        schema:
          $ref: '#/definitions/model.CreateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            type: string
        "400":
          description: Can not create the file
          schema:
            $ref: '#/definitions/model.CreateException'
        "404":
          description: Can not create the file
          schema:
            $ref: '#/definitions/model.CreateException'
      summary: Create a file
swagger: "2.0"
